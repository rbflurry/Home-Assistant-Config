esphome:
  name: radar-speed-wired
  friendly_name: radar-speed-wired

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  use_address: 192.168.98.111

# Enable Home Assistant API
api:
  encryption:
    key: "BwrtxibHDQjfkAh7ZinFAezRifu8H4XS/OMKRmgD2gs="
  reboot_timeout: 0s
  
ota:
  - platform: esphome
    password: "34957bb617527dfce2411bb6163fcc32"

#wifi:
 # ssid: !secret wifi_ssid
 # password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  #ap:
  #  ssid: "Speed-Radar-Wired"
  #  password: "qYGSoUhwjkdK"

#captive_portal:

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  logs:
    ld2451: DEBUG

web_server:
  port: 80

uart:
  id: radar_uart
  rx_pin: GPIO44
  #tx_pin: GPIO17
  baud_rate: 115200
  rx_buffer_size: 512


ld2451:
  id: radar
  uart_id: radar_uart

sensor:
  - platform: ld2451
    ld2451_id: radar
    speed:
      name: "Radar Speed"
    distance:
      name: "Radar Distance"
    angle:
      name: "Radar Angle"
    snr:
      name: "Radar SNR"
    target_count:
      name: "Radar Target Count"

binary_sensor:
  - platform: ld2451
    ld2451_id: radar
    approaching:
      name: "Radar Approaching"
      filters:
        - delayed_off: 3s