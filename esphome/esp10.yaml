substitutions:
  devicename: winnebago-plug
  upper_devicename: Winnebago-Plug

esphome:
  name: ${devicename}
  comment: winnebago plug

esp8266:
  board: esp01_1m

packages:
  device_base: !include common.yaml
  device_switches_sensors: !include default-sensors-switches.yaml

wifi:
  networks:
    - ssid: !secret wifi_ssid_dog_iot
      password: !secret wifi_password_dog_iot
      manual_ip:
        static_ip: 192.168.62.11
        gateway: 192.168.62.1
        subnet: 255.255.255.0
      priority: 4
    - ssid: !secret wifi_ssid_dog
      password: !secret wifi_password_dog
      manual_ip:
        static_ip: 192.168.62.11
        gateway: 192.168.62.1
        subnet: 255.255.255.0
      priority: 2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
      ssid: ${devicename} Fallback
      password: !secret wifi_pass

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: "${devicename} Button"
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "${devicename} Status"

sensor:
  - platform: cse7766
    current:
      name: Current
      accuracy_decimals: 1
      filters:
        - throttle_average: ${update_interval}
    voltage:
      name: Voltage
      accuracy_decimals: 1
      filters:
        - throttle_average: ${update_interval}
    power:
      name: Power
      id: wattage
      accuracy_decimals: 1
      filters:
        - throttle_average: ${update_interval}
  - platform: total_daily_energy
    name: Total Daily Energy
    id: tde
    power_id: wattage
    filters:
        - multiply: 0.001  ## convert Wh to kWh
    unit_of_measurement: kWh
    state_class: total_increasing

time:
  - platform: homeassistant
    id: homeassistant_time

switch:
  - platform: gpio
    name: "${devicename}"
    pin: GPIO12
    id: relay

status_led:
  pin: GPIO13


