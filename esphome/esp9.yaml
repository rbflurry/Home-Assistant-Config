substitutions:
  devicename: esp9
  upper_devicename: esp9

esphome:
  name: ${devicename}
  comment: garage attic fan
esp8266:
  board: esp01_1m

packages:
  device_base: !include common.yaml
  device_switches_sensors: !include default-sensors-switches.yaml

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    name: ${devicename} Button
    on_press:
      - switch.toggle: relay

sensor:
  - platform: cse7766
    current:
      name: ${devicename} Current
      accuracy_decimals: 1
      filters:
        - throttle_average: ${update_interval}
    voltage:
      name: ${devicename} Voltage
      accuracy_decimals: 1
      filters:
        - throttle_average: ${update_interval}
    power:
      name: ${devicename} Power
      id: wattage
      accuracy_decimals: 1
      filters:
        - throttle_average: ${update_interval}
  - platform: total_daily_energy
    name: Total Daily Energy
    id: tde
    power_id: wattage
    filters:
        - multiply: 0.001  ## convert Wh to kWh
    unit_of_measurement: kWh
    state_class: total_increasing

switch:
  - platform: gpio
    name: ${devicename}
    pin: GPIO12
    id: relay

status_led:
  pin: GPIO13

time:
  - platform: homeassistant
    id: homeassistant_time