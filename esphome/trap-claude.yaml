# =============================================================================
# Victor Smart-Kill -> local ESPHome  *** PRODUCTION ***
# Model: deep sleep; timer wake = report; catch = plates short -> Schmitt pulls
# RST -> "External System" wake -> confirm GPIO12 -> 10s HV -> re-confirm -> green.
#
# Pins: GPIO12 catch (active-LOW) | GPIO2 sense(to U6) | GPIO4 batt-divider enable
#       GPIO5 blue(D3) | GPIO14 red(D1) | GPIO15 green(D2) | GPIO13 HV PWM->Q8 | A0 batt
# Battery + GPIO4 method + HV 230.6Hz PWM carried over from the prior working config.
#
# *** "Arm trap" (default OFF) gates the HV. OFF = catch logged but no shock. ***
# =============================================================================

substitutions:
  node_name: victor-trap-01
  hv_duty: "0.284"          # ~28% duty at 230.6 Hz (from prior working config)
  report_sleep: "6h"

esp8266:
  board: esp01_1m

esphome:
  name: ${node_name}
  on_boot:
    priority: -100
    then:
      - lambda: 'pinMode(4, OUTPUT); digitalWrite(4, 1);'   # enable A0 battery divider (proven)
      - output.turn_on: gpio0                                # GPIO0 HIGH -> clean boot on catch-reset
      - output.set_level: { id: hv_pwm, level: 0.0 }         # HV off
      - output.set_level: { id: hv_pwm2, level: 0.0 }
      - lambda: 'ESP_LOGI("trap","reset reason: %s", ESP.getResetReason().c_str());'
      - if:
          condition:
            lambda: 'return ESP.getResetReason() == "External System";'
          then:
            - if:
                condition:
                  lambda: 'return digitalRead(12) == 0;'     # GPIO12 LOW = plates shorted = catch
                then:
                  - logger.log: "CATCH confirmed (GPIO12 low)"
                  - output.turn_on: led_catch                # red
                  - lambda: 'id(kill_count) += 1;'
                  - component.update: kill_total
                  - if:
                      condition:
                        lambda: 'return id(armed);'
                      then:
                        - logger.log: "firing HV ~10s"
                        - output.set_level:
                            id: hv_pwm
                            level: ${hv_duty}
                        - output.set_level:
                            id: hv_pwm2
                            level: ${hv_duty}
                        - delay: 10s
                        - output.set_level:
                            id: hv_pwm
                            level: 0.0
                        - output.set_level:
                            id: hv_pwm2
                            level: 0.0
                      else:
                        - logger.log: "DISARMED - HV not fired"
                  - if:
                      condition:
                        lambda: 'return digitalRead(12) == 0;'   # still shorted = target present
                      then:
                        - logger.log: "plates STILL shorted - target present"
                        - repeat:
                            count: 5
                            then:
                              - output.turn_on: led_green
                              - delay: 150ms
                              - output.turn_off: led_green
                              - delay: 150ms
                      else:
                        - logger.log: "plates clear after cycle"
                else:
                  - logger.log: "ext reset but plates NOT shorted - ignoring"
          else:
            - logger.log: "routine wake"

globals:
  - id: kill_count
    type: int
    restore_value: true
    initial_value: '0'
  - id: armed
    type: bool
    restore_value: true
    initial_value: 'false'

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - output.turn_on: led_status     # blue = awake + online
 # ap:
##   password: !secret ap_password
captive_portal:

api:
 # encryption:
 #   key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

# ------------- Inputs -------------
binary_sensor:
  - platform: gpio
    name: "Catch line (GPIO12)"
    pin: { number: GPIO12, mode: { input: true } }

# ------------- Sensors -------------
sensor:
  - platform: adc
    pin: A0
    id: batt_v
    name: "Battery voltage"
    update_interval: 10s
    filters:
      - multiply: 6.3659            # ADC pin volts -> pack volts (from prior working config)
      - median: { window_size: 7, send_every: 3 }
    unit_of_measurement: "V"
    accuracy_decimals: 2
  - platform: template
    name: "Battery %"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const float VFULL = 6.40, VEMPTY = 4.60;
      float pct = (id(batt_v).state - VEMPTY) / (VFULL - VEMPTY) * 100.0;
      return pct < 0 ? 0 : (pct > 100 ? 100 : pct);
  - platform: template
    name: "Kill total"
    id: kill_total
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return id(kill_count);'

# ------------- Outputs -------------
output:
  - platform: esp8266_pwm            # HV drive A -> Q8 -> transformer
    pin: GPIO13
    id: hv_pwm
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0
  - platform: esp8266_pwm            # HV drive B (GPIO2) - needed for full HV
    pin: GPIO2
    id: hv_pwm2
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0
  - platform: gpio
    pin: GPIO0
    id: gpio0                        # held HIGH (clean boot on catch-reset)
  - platform: gpio
    pin: GPIO5
    id: led_status                   # blue D3
  - platform: gpio
    pin: GPIO14
    id: led_catch                    # red D1
  - platform: gpio
    pin: GPIO15
    id: led_green                    # green D2

# ------------- Control -------------
switch:
  - platform: template
    name: "Arm trap (HV live)"
    lambda: 'return id(armed);'
    turn_on_action:
      - lambda: 'id(armed) = true;'
    turn_off_action:
      - lambda: 'id(armed) = false;'
  - platform: template
    name: "Stay awake (maintenance)"
    optimistic: true
    turn_on_action:
      - deep_sleep.prevent: trap_sleep
    turn_off_action:
      - deep_sleep.allow: trap_sleep

button:
  - platform: template
    name: "HV test 3s (CAUTION)"
    on_press:
      - output.set_level:
          id: hv_pwm
          level: ${hv_duty}
      - output.set_level:
          id: hv_pwm2
          level: ${hv_duty}
      - delay: 3s
      - output.set_level:
          id: hv_pwm
          level: 0.0
      - output.set_level:
          id: hv_pwm2
          level: 0.0

# ------------- Sleep -------------
deep_sleep:
  id: trap_sleep
  run_duration: 25s
  sleep_duration: ${report_sleep}
