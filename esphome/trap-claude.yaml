# =============================================================================
# Victor Smart-Kill -> BRING-UP BASELINE (minimal, guaranteed boot)
# Purpose: prove WiFi + API + blue LED work with NOTHING else touching GPIO.
# No deep sleep. No GPIO0/2/4/13. No PWM. No on_boot lambdas.
# UART logger DISABLED (baud_rate: 0) - GPIO1/3 are used by the board.
# If this connects to HA and lights blue, we add one block back at a time.
# =============================================================================

substitutions:
  node_name: victor-trap-01

esp8266:
  board: esp01_1m

esphome:
  name: ${node_name}
  # --- STEP 2: GPIO0 high at boot (ALONE). GPIO0 is a boot strap - watch for crash. ---
  on_boot:
    priority: -100
    then:
      - output.turn_on: gpio0                                # GPIO0 high (clean boot)

logger:
  baud_rate: 0            # UART off - TX/RX (GPIO1/3) repurposed by the trap

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - output.turn_on: led_status     # blue = WiFi up

api:                                 # encryption off for fast test builds
ota:
  - platform: esphome
    password: !secret ota_password

# --- STEP 2b: battery read. Toggle "GPIO0" switch OFF (=low) and watch these. ---
sensor:
  - platform: adc
    pin: A0
    id: batt_v
    name: "Battery voltage"
    update_interval: 2s              # fast for the GPIO0 toggle test
    filters:
      - multiply: 6.3659             # ADC pin volts -> pack volts
    unit_of_measurement: "V"
    accuracy_decimals: 2
  - platform: template
    name: "Battery %"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      const float VFULL = 6.40, VEMPTY = 4.60;
      float pct = (id(batt_v).state - VEMPTY) / (VFULL - VEMPTY) * 100.0;
      return pct < 0 ? 0 : (pct > 100 ? 100 : pct);

output:
  - platform: gpio
    pin: GPIO5
    id: led_status        # blue D3
  # --- STEP 1: HV PWM drive (GPIO13 + GPIO2). GPIO2 is a boot strap pin - watch for crash. ---
  - platform: esp8266_pwm
    pin: GPIO13
    id: hv_pwm
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0
  - platform: esp8266_pwm
    pin: GPIO2
    id: hv_pwm2
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0
  - platform: gpio
    pin: GPIO0
    id: gpio0             # held HIGH; toggle LOW only to sample battery

switch:
  - platform: output
    name: "GPIO0 (divider test - OFF=low)"
    output: gpio0
    restore_mode: ALWAYS_ON

button:
  - platform: template
    name: "HV test 3s (CAUTION)"
    on_press:
      - output.set_level: { id: hv_pwm, level: 0.284 }
      - output.set_level: { id: hv_pwm2, level: 0.284 }
      - delay: 3s
      - output.set_level: { id: hv_pwm, level: 0.0 }
      - output.set_level: { id: hv_pwm2, level: 0.0 }
