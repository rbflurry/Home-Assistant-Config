# =============================================================================
# BENCH TEST build (SLEEP A/B) -- HV DISABLED, safe to poke the plates.
# The BLUE LED lights when it WOULD have shocked (instead of firing HV).
# Deep sleep ENABLED (run 15s / sleep 60s) to test wake-on-touch from sleep.
# "Stay awake" switch flips to always-awake so you can compare the two states.
#   - Stay awake OFF (sleeping): touch during the 60s sleep -> does it WAKE + blue?
#   - Stay awake ON  (awake):    touch -> reboots -> blue every time (known good)
# If it wakes every touch when sleeping, deep sleep is fine. If touches that work
# awake DON'T wake it from sleep, deep sleep is desensitizing the catch.
# Detection path is identical to production: bridge the plates -> sense pulls
# RST -> board reboots -> if plates read bridged = "Catch" -> BLUE on 10s.
# HV drive pins (GPIO13/GPIO2) are held LOW the whole time = no high voltage.
# =============================================================================

substitutions:
  node_name: local-kill-hvtest-sleep

esp8266:
  board: esp01

esphome:
  name: ${node_name}
  name_add_mac_suffix: true
  on_boot:
    priority: -100
    then:
      - output.turn_off: hv_a                 # HV drive OFF (held low = no HV, ever)
      - output.turn_off: hv_b
      - output.turn_off: led_shock            # blue off
      - output.turn_on: gpio0                 # GPIO0 high (clean boot)
      - lambda: |-
          // PLATES decide a catch, NOT the reset reason: waking from deep sleep often
          // reports "Deep-Sleep Wake"/"Power On" even when an external reset (a catch)
          // woke it. Sample for ~225ms in case the sense lags right after wake.
          bool bridged = false;
          for (int i = 0; i < 15; i++) {
            if (digitalRead(12) == 0) { bridged = true; break; }
            delay(15);
          }
          String r = ESP.getResetReason();
          if (bridged)                      id(wake_reason) = "Catch";   // bridged = catch, whatever woke it
          else if (r == "Deep-Sleep Wake")  id(wake_reason) = "Scheduled";
          else if (r == "Power On")         id(wake_reason) = "Power on";
          else if (r == "External System")  id(wake_reason) = "Button";
          else                              id(wake_reason) = std::string(r.c_str());
      - component.update: wake_reason_s
      # CATCH -> show where HV WOULD fire, with the BLUE LED. No HV.
      - if:
          condition:
            lambda: 'return id(wake_reason) == std::string("Catch");'
          then:
            - logger.log: "CATCH (TEST): blue = would-shock 10s, HV disabled"
            - output.turn_on: led_catch         # red = caught
            - output.turn_on: led_shock         # BLUE = would be shocking now
            - lambda: 'id(kill_count) += 1; id(needs_cleaning) = true;'
            - component.update: kill_total
            - delay: 10s
            - output.turn_off: led_shock
            - output.turn_off: led_catch
      # battery sample once (GPIO0 low -> read -> high)
      - output.turn_off: gpio0
      - delay: 250ms
      - component.update: batt_v
      - delay: 50ms
      - output.turn_on: gpio0
      - component.update: batt_pct
      - light.turn_on:                          # green breathe = awake
          id: led_status
          effect: "Breathe"

globals:
  - id: kill_count
    type: int
    restore_value: true
    initial_value: '0'
  - id: needs_cleaning
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: wake_reason
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: stay_awake
    type: bool
    restore_value: false
    initial_value: 'false'

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:                                            # no encryption for the bench

binary_sensor:
  - platform: gpio
    name: "Plates bridged"
    pin: { number: GPIO12, inverted: true, mode: { input: true } }   # ON = shorted
  - platform: template
    name: "Needs cleaning"
    device_class: problem
    lambda: 'return id(needs_cleaning);'

sensor:
  - platform: adc
    pin: A0
    id: batt_v
    name: "Battery voltage"
    update_interval: never
    filters:
      - multiply: 6.44
    unit_of_measurement: "V"
    accuracy_decimals: 2
  - platform: template
    name: "Battery %"
    id: batt_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float p = (id(batt_v).state - 4.60) / (6.40 - 4.60) * 100.0;
      return roundf(p < 0 ? 0 : (p > 100 ? 100 : p));
  - platform: template
    name: "Kill total"
    id: kill_total
    accuracy_decimals: 0
    update_interval: never
    lambda: 'return id(kill_count);'

text_sensor:
  - platform: template
    name: "Wake reason"
    id: wake_reason_s
    update_interval: never
    lambda: 'return {id(wake_reason)};'

output:
  - platform: gpio
    pin: GPIO13
    id: hv_a                 # HV drive A - held LOW in this build (no HV)
  - platform: gpio
    pin: GPIO2
    id: hv_b                 # HV drive B - held LOW in this build (no HV)
  - platform: gpio
    pin: GPIO0
    id: gpio0
  - platform: gpio
    pin: GPIO5
    id: led_shock            # BLUE - lights when it WOULD shock
  - platform: gpio
    pin: GPIO14
    id: led_catch            # red - caught
  - platform: esp8266_pwm
    pin: GPIO15
    id: led_status_pwm
    frequency: 1000 Hz

light:
  - platform: monochromatic
    name: "Status LED"
    id: led_status
    output: led_status_pwm
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Breathe"
          transition_length: 1500ms
          update_interval: 1500ms
          min_brightness: 5%
          max_brightness: 90%

button:
  - platform: template
    name: "Would-shock test 3s (blue, no HV)"
    on_press:
      - output.turn_on: led_shock
      - delay: 3s
      - output.turn_off: led_shock
  - platform: template
    name: "Sample battery now"
    on_press:
      - output.turn_off: gpio0
      - delay: 250ms
      - component.update: batt_v
      - delay: 50ms
      - output.turn_on: gpio0
      - component.update: batt_pct

switch:
  - platform: template
    name: "Stay awake"                 # ON = never sleep (always-awake A/B baseline)
    lambda: 'return id(stay_awake);'
    turn_on_action:
      - lambda: 'id(stay_awake) = true;'
      - deep_sleep.prevent: trap_sleep
    turn_off_action:
      - lambda: 'id(stay_awake) = false;'
      - deep_sleep.allow: trap_sleep

deep_sleep:
  id: trap_sleep
  run_duration: 15s                     # awake 15s after each wake
  sleep_duration: 60s                   # then sleep 60s (touch the plates during this)
