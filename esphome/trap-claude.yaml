# =============================================================================
# Victor trap - SLEEP TEST
#   Blue LED (GPIO5)  = board is awake AND connected to Wi-Fi (status light)
#   Red  LED (GPIO14) = this wake was an EXTERNAL RESET (reset / catch pulling RST)
#   Then the board deep-sleeps; it wakes on the timer (red stays OFF) or on an
#   external reset (red turns ON), so you can tell the two apart.
# =============================================================================

substitutions:
  node_name: victor-sleeptest
  pin_led_b: "GPIO5"      # blue = status
  pin_led_r: "GPIO14"     # red  = woke from external reset

esp8266:
  board: esp01_1m

esphome:
  name: ${node_name}
  on_boot:
    priority: -100        # run late, after core init, so outputs exist
    then:
      - lambda: |-
          // Light red only if we woke from an external reset (RST pin pulled).
          // Timer wake reports "Deep-Sleep Wake"; cold power-up reports "Power On".
          if (ESP.getResetReason() == "External System") {
            id(out_r).turn_on();
          }
      - logger.log:
          format: "Boot - reset reason: %s"
          args: ['ESP.getResetReason().c_str()']

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - output.turn_on: out_b      # blue ON = awake + Wi-Fi connected
  on_disconnect:
    - output.turn_off: out_b
 # ap:
 #   ssid: "${node_name}-setup"
 #   password: !secret ap_password

#captive_portal:

#api:
 # encryption:
 #   key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

output:
  - platform: esp8266_pwm
    pin: ${pin_led_b}
    id: out_b
    frequency: 1000 Hz
  - platform: esp8266_pwm
    pin: ${pin_led_r}
    id: out_r
    frequency: 1000 Hz

# Deep sleep: stay awake long enough to connect + observe, then sleep.
# Timer wake every 60 s; an external reset (reset button / catch) wakes it
# out of cycle and lights the red LED.
deep_sleep:
  id: trap_sleep
  run_duration: 30s
  sleep_duration: 60s
