# =============================================================================
# Victor Smart-Kill -> local ESPHome  *** PRODUCTION firmware ***
# Operating model (reverse-engineered + bench-confirmed):
#   - Deep sleep between events. Timer wake = routine battery/status report.
#   - Catch: rodent shorts plates -> TC7WH14FU Schmitt watchdog pulls RST ->
#     "External System" reset wakes the ESP. On that wake we fire the HV drive
#     (GPIO13+GPIO2), flash red, count, and report.
#   - HV is hardware-gated by SW2 (chamber present), so it can't fire with the
#     kill chamber removed.
#
# Pins: GPIO12 catch | GPIO4 battery-divider enable | GPIO5 blue(status)
#       GPIO14 red(catch) | GPIO15 green(spare) | GPIO13+GPIO2 HV drive | A0 batt
#
# *** SAFETY: the "Arm trap" switch (default OFF) gates the HV. While OFF a catch
#     is logged/counted/flashed but HV does NOT fire. Arm it only when deployed. ***
# =============================================================================

substitutions:
  node_name: victor-trap-01
  batt_divider: "6.5"        # calibrate: feed 5.0V, read A0 raw, divider = 5120/raw
  kill_cycles: "2000"        # HV drive cycles on a catch (~2s). Stock uses thousands;
                             # raise to lengthen the shock (watchdog-fed below).
  kill_hi_us: "1200"
  kill_lo_us: "1000"
  report_sleep: "6h"         # routine report cadence (timer wake)

esp8266:
  board: esp01_1m

esphome:
  name: ${node_name}
  on_boot:
    priority: -100
    then:
      - output.turn_off: hv_a
      - output.turn_off: hv_b
      - output.turn_on: batt_en         # GPIO4 enables battery divider for this awake window
      - lambda: 'ESP_LOGI("trap", "reset reason: %s", ESP.getResetReason().c_str());'
      - if:
          condition:
            lambda: 'return ESP.getResetReason() == "External System";'
          then:
            - logger.log: "CATCH wake (external reset)"
            - output.turn_on: led_catch        # red
            - lambda: 'id(kill_count) += 1;'
            - component.update: kill_total
            - if:
                condition:
                  lambda: 'return id(armed);'
                then:
                  - script.execute: deliver_kill
                else:
                  - logger.log: "Trap DISARMED - HV not fired"
          else:
            - logger.log: "Routine wake"

globals:
  - id: kill_count
    type: int
    restore_value: true
    initial_value: '0'
  - id: armed
    type: bool
    restore_value: true
    initial_value: 'false'

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - output.turn_on: led_status          # blue = awake + online
#  ap:
#    ssid: "${node_name}-setup"
#    password: !secret ap_password
#captive_portal:

#api:
#  encryption:
#    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

# ------------- Outputs -------------
output:
  - platform: gpio
    pin: GPIO13
    id: hv_a
  - platform: gpio
    pin: GPIO2
    id: hv_b
  - platform: gpio
    pin: GPIO4
    id: batt_en
  - platform: esp8266_pwm
    pin: GPIO5
    id: led_status
    frequency: 1000 Hz
  - platform: esp8266_pwm
    pin: GPIO14
    id: led_catch
    frequency: 1000 Hz

# ------------- Inputs / sensors -------------
binary_sensor:
  - platform: gpio
    name: "Catch line (raw)"
    pin:
      number: GPIO12
      mode:
        input: true

sensor:
  - platform: adc
    name: "A0 raw"
    id: a0_raw
    pin: A0
    raw: true
    update_interval: 10s        # reads while awake (batt_en held on)
  - platform: template
    name: "Battery voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(a0_raw).state / 1024.0 * ${batt_divider};'
  - platform: template
    name: "Kill total"
    id: kill_total
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return id(kill_count);'

# ------------- Arm / control -------------
switch:
  - platform: template
    name: "Arm trap (HV live)"
    lambda: 'return id(armed);'
    turn_on_action:
      - lambda: 'id(armed) = true;'
    turn_off_action:
      - lambda: 'id(armed) = false;'
  - platform: template
    name: "Stay awake (maintenance)"
    optimistic: true
    turn_on_action:
      - deep_sleep.prevent: trap_sleep
    turn_off_action:
      - deep_sleep.allow: trap_sleep

button:
  # Short manual HV test (bench). Independent of the Arm switch - use with care,
  # chamber/SW2 decides whether real HV is produced.
  - platform: template
    name: "HV test burst (CAUTION)"
    on_press:
      - script.execute: deliver_kill

# ------------- HV drive -------------
script:
  - id: deliver_kill
    then:
      - logger.log: "HV burst START"
      - lambda: |-
          const int cycles = ${kill_cycles};
          for (int i = 0; i < cycles; i++) {
            id(hv_b).turn_on();  id(hv_a).turn_on();
            delayMicroseconds(${kill_hi_us});
            id(hv_b).turn_off(); id(hv_a).turn_off();
            delayMicroseconds(${kill_lo_us});
            if ((i & 0x3F) == 0) { ESP.wdtFeed(); }   // keep watchdog happy on long bursts
          }
          id(hv_a).turn_off(); id(hv_b).turn_off();
      - logger.log: "HV burst DONE"

# ------------- Sleep -------------
# Wakes on the timer (routine report) or on an external reset (catch).
deep_sleep:
  id: trap_sleep
  run_duration: 25s           # time to connect, report, (fire kill if armed)
  sleep_duration: ${report_sleep}
