# =============================================================================
# Victor Smart-Kill -> BRING-UP BASELINE (minimal, guaranteed boot)
# Purpose: prove WiFi + API + blue LED work with NOTHING else touching GPIO.
# No deep sleep. No GPIO0/2/4/13. No PWM. No on_boot lambdas.
# UART logger DISABLED (baud_rate: 0) - GPIO1/3 are used by the board.
# If this connects to HA and lights blue, we add one block back at a time.
# =============================================================================

substitutions:
  node_name: victor-trap-01

esp8266:
  board: esp01_1m

esphome:
  name: ${node_name}

logger:
  baud_rate: 0            # UART off - TX/RX (GPIO1/3) repurposed by the trap

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - output.turn_on: led_status     # blue = WiFi up
#ap:
 #   ssid: "${node_name}-setup"
 #   password: !secret ap_password
#captive_portal:

api:
 # encryption:
 #   key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

output:
  - platform: gpio
    pin: GPIO5
    id: led_status        # blue D3
  # --- STEP 1: HV PWM drive (GPIO13 + GPIO2). GPIO2 is a boot strap pin - watch for crash. ---
  - platform: esp8266_pwm
    pin: GPIO13
    id: hv_pwm
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0
  - platform: esp8266_pwm
    pin: GPIO2
    id: hv_pwm2
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0

button:
  - platform: template
    name: "HV test 3s (CAUTION)"
    on_press:
      - output.set_level: { id: hv_pwm, level: 0.284 }
      - output.set_level: { id: hv_pwm2, level: 0.284 }
      - delay: 3s
      - output.set_level: { id: hv_pwm, level: 0.0 }
      - output.set_level: { id: hv_pwm2, level: 0.0 }
