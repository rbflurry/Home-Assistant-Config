# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: garage-door-lights
  friendly_name: garage-door-lights

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "2wdqAMPaTvnQIR7G77G7XshpxVwTs7PonOr9jX8Gr4w="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: garage-door-lig Fallback Hotspot
    password: "aTJWQKK5b4MN"

captive_portal:

switch:
  - platform: gpio
    pin: GPIO16
    name: "Relay 1"
    id: relay_1

  - platform: gpio
    pin: GPIO17
    name: "Relay 2"
    id: relay_2

light:
  - platform: binary
    name: "Status LED"
    output: led3_output

output:
  - platform: gpio
    pin: GPIO23
    id: led3_output