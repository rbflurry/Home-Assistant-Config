esphome:
  name: winnebago-temp
  friendly_name: winnebago-temp
substitutions:
  devicename: winnebago-temp
  upper_devicename: Winnebago-Temp
packages:
  device_base: !include common.yaml
  device_switches_sensors: !include default-sensors-switches.yaml

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "ATtXPeimYkxrF+xeGgR811e0ueix+5TduhyBtpsZABs="

#ota:
#  - platform: esphome
#    password: "941b025e26f36d2bc84cf520a4cbf80a"

wifi:
  networks:
    - ssid: !secret wifi_ssid_dog_iot
      password: !secret wifi_password_dog_iot
      manual_ip:
        static_ip: 192.168.62.10
        gateway: 192.168.62.1
        subnet: 255.255.255.0
      priority: 4
    - ssid: !secret wifi_ssid_dog
      password: !secret wifi_password_dog
      manual_ip:
        static_ip: 192.168.62.10
        gateway: 192.168.62.1
        subnet: 255.255.255.0
      priority: 2


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  #ap:
   # ssid: "Winnebago Fallback Hotspot"
    #password: "zbveGxFruUo9"

captive_portal:

web_server:
  
sensor:
  - platform: dht
    model: DHT22
    pin: 4
    temperature:
      name: "Winnebago Temperature"
      filters:
        - lambda: return x * (9.0/5.0) + 32.0;
      unit_of_measurement: "°F"
    humidity:
      name: "Winnebago Humidity"
    update_interval: 60s

    