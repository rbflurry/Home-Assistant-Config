esphome:
  name: winnebago-temp
  friendly_name: winnebago
substitutions:
  devicename: winnebago-temp
  upper_devicename: Winnebago-Temp
packages:
  device_base: !include common.yaml
  device_switches_sensors: !include default-sensors-switches.yaml

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# Enable Home Assistant API
api:
  encryption:
    key: "ATtXPeimYkxrF+xeGgR811e0ueix+5TduhyBtpsZABs="
  reboot_timeout: 0s

mqtt:
  broker: 192.168.47.103
  username: winnebago-temp
  password: winnebago-temp
  discovery: true
  discovery_unique_id_generator: mac


wifi:
  networks:
    - ssid: !secret wifi_ssid_dog_iot
      password: !secret wifi_password_dog_iot
      priority: 4
    - ssid: !secret wifi_ssid_dog
      password: !secret wifi_password_dog
      priority: 2


captive_portal:

web_server:

#bluetooth_proxy:
i2c:
  scl: GPIO23
  sda: GPIO22
  scan: true
sensor:
#  - platform: dht
#    model: DHT22
#    pin: 21
#    temperature:
#      name: "Temperature"
#      filters:
#        - lambda: return x * (9.0/5.0) + 32.0;
#      unit_of_measurement: "°F"
#    humidity:
#      name: "Humidity"
#    update_interval: 60s

  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "Temperature"
    pressure:
      name: "Pressure"
    humidity:
      name: "Humidity"