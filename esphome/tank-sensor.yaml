#    password: "L9nhODB7NwRC"

#captive_portal:

uart:
  - id: uart_sensor1
    rx_pin: GPIO17
    baud_rate: 9600
  - id: uart_sensor2
    rx_pin: GPIO23
    baud_rate: 9600

sensor:
  - platform: a02yyuw
    uart_id: uart_sensor1
    name: "Black Tank Distance"
    id: black_raw
    filters:
      - throttle: 3s
  - platform: a02yyuw
    uart_id: uart_sensor2
    name: "Grey Tank Distance"
    id: grey_raw
    filters:
      - throttle: 3s
  - platform: template
    name: "Black Tank Level"
    id: black_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 3s
    lambda: |-
      if (isnan(id(black_raw).state)) return {};
      float empty_distance = 175.0;   // mm from sensor to empty tank bottom (calibrate!)
      float full_distance  = 100.0;    // mm when full (blind zone + offset)
      float height = empty_distance - id(black_raw).state;
      float percent = (height / (empty_distance - full_distance)) * 100.0;
      return (percent < 0) ? 0 : (percent > 100) ? 100 : percent;
  - platform: template
    name: "Grey Tank Level"
    id: grey_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 3s
    lambda: |-
      if (isnan(id(grey_raw).state)) return {};
      float empty_distance = 214.0;   // mm from sensor to empty tank bottom (calibrate!)
      float full_distance  = 100.0;    // mm when full (blind zone + offset)
      float height = empty_distance - id(grey_raw).state;
      float percent = (height / (empty_distance - full_distance)) * 100.0;
      return (percent < 0) ? 0 : (percent > 100) ? 100 : percent;
    
espnow:
  peers:
   # - "78:1C:3C:2B:78:64"   # ← Put the MAC address of your DISPLAY ESP32 here
    - "DC:54:75:FB:D2:2C"
  channel: 1

packet_transport:
  - platform: espnow
    update_interval: 5s
    peer_address: "DC:54:75:FB:D2:2C"   # same MAC as above
    sensors:
      - black_level
      - grey_level
      - black_raw
      - grey_raw