- sensor:
  - default_entity_id: sensor.current_week
    state: >-
      {% set dummy = states("sensor.date") %} {%- if (as_timestamp(now()) | timestamp_custom('%W',
      true) | int ) % 2 == 0 -%}
        Even Week (Week# {{ as_timestamp(now()) | timestamp_custom('%W', true) }})
      {%- else -%}
        Odd Week (Week# {{ as_timestamp(now()) | timestamp_custom('%W', true) }})
      {%- endif -%}
    name: current_week
- sensor:
  - default_entity_id: sensor.trash_day
    state: >-
      {% set dummy = states("sensor.date") %} {%- set pickupDay = "thursday" | lower
      -%} {%- macro day_of_week(timestamp) -%}
        {{ as_timestamp(timestamp)| timestamp_custom('%A', true) | lower }}
      {%- endmacro -%} {%- if day_of_week(now()) == pickupDay -%}
        yes
      {%- else -%}
        no
      {%- endif -%}
    name: trash_day
- sensor:
  - default_entity_id: sensor.recycle_day
    state: >-
      {% set dummy = states("sensor.date") %} {%- set pickupDay = "thursday" | lower
      -%} {%- set evenWeekPickup = false %} {%- macro day_of_week(timestamp) -%}
        {{ as_timestamp(timestamp)| timestamp_custom('%A', true) | lower }}
      {%- endmacro %}       {%- macro week_number_of_year() -%}
        {{ as_timestamp(now()) | timestamp_custom('%W', true) | int }}
      {%- endmacro %} {%- macro is_it_this_week() -%}
        {%- if as_timestamp(now()) | timestamp_custom('%W', true) | int % 2 == 0 -%}
          {%- if evenWeekPickup == true -%}
            true
          {%- else -%}
            false
          {%- endif -%}
        {%- else -%}
          {%- if evenWeekPickup == true -%}
            false
          {%- else -%}
            true
          {%- endif -%}
        {%- endif -%}
      {%- endmacro -%} {%- macro is_it_today() -%} {%- if is_it_this_week() == "true"
      -%}
        {%- if day_of_week(now()) | lower == pickupDay -%}
          yes
        {%- else -%}
          no
        {%- endif -%}
      {%- else -%}
        no
      {%- endif -%} {%- endmacro -%} {{- is_it_today() -}}
    name: recycle_day
