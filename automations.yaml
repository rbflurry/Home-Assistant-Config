- id: '1584913993330'
  alias: Bathroom Vent/Fan
  description: ''
  trigger:
  - above: 97
    entity_id:
    - sensor.bathroom_humid
    for:
      hours: 0
      minutes: 10
      seconds: 0
    platform: numeric_state
    id: 'on'
  - entity_id: sensor.bathroom_humid
    for:
      hours: 0
      minutes: 1
      seconds: 0
    platform: numeric_state
    id: 'off'
    below: 89
  condition:
  - condition: template
    value_template: '{{true if now() - states.switch.bathroom_fan.last_changed < timedelta(minutes=2)
      else false }}'
    enabled: false
  - condition: template
    value_template: '{{true if now() - state_attr(''automation.night_time'', ''last_triggered'')
      < timedelta(minutes=5) else false }}'
    enabled: false
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: 'off'
      - condition: state
        entity_id: switch.bathroom_fan
        state: 'on'
      sequence:
      - service: switch.turn_off
        data: {}
        target:
          entity_id: switch.bathroom_fan
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - service: switch.turn_on
        data: {}
        target:
          entity_id: switch.bathroom_fan
  mode: single
