- id: '1665668429834'
  alias: Door Alerts v2
  description: ''
  triggers:
  - platform: state
    entity_id: binary_sensor.garage_entry_door, binary_sensor.front_door, binary_sensor.wink_back_door_opened,
      binary_sensor.basement_door, binary_sensor.front_door
    to: 'on'
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
    value_template: '{{ float(state.state) }}'
    enabled: false
  actions:
  - wait_template: '{% set new = trigger.entity_id %} {{ is_state(new, ''off'') }}

      '
    timeout: 00:00:10
  - data:
      message: "{% set new = trigger.entity_id %} {% if is_state(new, 'off') %}\n
        \ {{ trigger.to_state.name }} was opened and closed.\n{% else %}\n  {{ trigger.to_state.name
        }} was opened.\n{% endif %}\n"
      entity_id:
      - notify.telegram_bot_700554930_618533989
    action: telegram_bot.send_message
  - condition: template
    value_template: '{% set new = trigger.entity_id %} {{ is_state(new, ''on'') }}

      '
  - wait_template: '{% set new = trigger.entity_id %} {{ is_state(new, ''off'') }}

      '
  - data:
      message: '{{ trigger.to_state.name }} was closed.

        '
      entity_id:
      - notify.telegram_bot_700554930_618533989
    action: telegram_bot.send_message
  mode: parallel
  max: 10
- id: '1665711480975'
  alias: Climate -  Auto Craft Cool
  description: ''
  triggers:
  - value_template: '{{states.climate.craft_room.attributes.current_temperature >
      states.climate.craft_room.attributes.temperature +2 or states.climate.craft_room.attributes.current_temperature
      <= states.climate.craft_room.attributes.temperature}}'
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: template
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.craft_room
      state: heat
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{states.climate.craft_room.attributes.current_temperature
          <= states.climate.craft_room.attributes.temperature}}'
      sequence:
      - data:
          hvac_mode: 'off'
        target:
          entity_id: climate.craft_room
        action: climate.set_hvac_mode
    - conditions:
      - condition: template
        value_template: '{{states.climate.craft_room.attributes.current_temperature
          > states.climate.craft_room.attributes.temperature+2}}'
      sequence:
      - data:
          hvac_mode: cool
        target:
          entity_id: climate.craft_room
        action: climate.set_hvac_mode
  mode: single
- id: '1665711964366'
  alias: Climate - Auto Office Heat
  description: ''
  trigger:
  - platform: template
    value_template: '{{states.climate.office.attributes.current_temperature > states.climate.office.attributes.temperature
      or states.climate.office.attributes.current_temperature < states.climate.office.attributes.temperature-1}}

      '
    for:
