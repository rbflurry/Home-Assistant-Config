  alias: Basement - door activity, light on until 10 min after door closes
  description: Replaces timer.basement_light and its 3 automations. Only manages the
    light if it was off (or this automation turned it on). Refreshes the Z-Wave switch
    first in case its state is stale.
  triggers:
  - entity_id: binary_sensor.basement_door
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.basement_door
    from: 'on'
    to: 'off'
    trigger: state
  conditions:
  - alias: Light is off, or this automation already owns it
    condition: template
    value_template: '{{ is_state(''switch.wink_basement'', ''off'') or this.attributes.current
      | int(0) > 0 }}'
  actions:
  - if:
    - alias: First run (not extending)
      condition: template
      value_template: '{{ this.attributes.current | int(0) == 0 }}'
    then:
    - action: zwave_js.refresh_value
      data:
        entity_id:
        - switch.wink_basement
    - delay:
        seconds: 5
    - if:
      - condition: state
        entity_id: switch.wink_basement
        state: 'on'
      then:
      - stop: Light was already on (manual) - leave it alone
  - action: switch.turn_on
    target:
      entity_id: switch.wink_basement
  - wait_template: '{{ is_state(''binary_sensor.basement_door'', ''off'') }}'
  - delay:
      minutes: 10
  - action: switch.turn_off
    target:
      entity_id: switch.wink_basement
  mode: restart
