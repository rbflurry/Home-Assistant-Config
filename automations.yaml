- id: '1764787327088'
  alias: Carpet check
  description: ''
  triggers:
  - trigger: zone
    entity_id: person.ryan
    zone: zone.home
    event: leave
  - trigger: zone
    entity_id: person.chelsea
    zone: zone.home
    event: leave
  conditions: []
  actions:
  - action: camera.snapshot
    metadata: {}
    data:
      filename: /config/www/entryway_check.jpg
    target:
      entity_id: camera.lilold_mouse
    enabled: true
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
    enabled: false
  - action: ai_task.generate_data
    metadata: {}
    data:
      task_name: Carpet Check
      instructions: 'Your job is to emulate a camera image that is looking at the
        entryway to my house. Often shoes or otherthings are left on the black mat
        that would prevent or tangle a robot vacuum. Looking at the image can you
        respond with safe or unsafe so that I know weather or not it is safe to send
        out the vacuum to clean? Ignore the shoes that are on the shoe mat.

        Answer ONLY with one word: either "SAFE" or "UNSAFE"'
      attachments:
        media_content_id: media-source://camera/camera.lilold_mouse
        media_content_type: image/jpeg
        metadata:
          title: LilOld Mouse
          thumbnail: /api/camera_proxy/camera.lilold_mouse
          media_class: video
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://camera
      entity_id: ai_task.ollama_ai_task
    response_variable: floor_check
  - variables:
      ai_response: '{{ floor_check.data | trim }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''SAFE'' == ai_response }}'
      sequence:
      - action: vacuum.start
        target:
          entity_id: vacuum.robot_vacuum
        enabled: false
        data: {}
      - action: telegram_bot.send_photo
        metadata: {}
        data:
          verify_ssl: true
          config_entry_id: 01K1B4QHGPVS1AX9G0C0J9AM97
          file: /config/www/entryway_check.jpg
          caption: "Floor is clear! Starting vacuum. \U0001F9F9"
          target:
          - '618533989'
    default:
    - action: telegram_bot.send_photo
      metadata: {}
      data:
        verify_ssl: true
        config_entry_id: 01K1B4QHGPVS1AX9G0C0J9AM97
        file: /config/www/entryway_check.jpg
        caption: Really? You pig
        target:
        - '618533989'
  mode: single
