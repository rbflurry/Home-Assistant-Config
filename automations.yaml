  action:
  - wait_template: '{{ is_state(''light.sengled_e11_g13_035c3bc7_1'', ''off'')}}'
    continue_on_timeout: false
  - service: climate.turn_off
    target:
      entity_id:
      - climate.office
      - climate.craft_room
    data: {}
