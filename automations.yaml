- id: '1584913993330'
  alias: Bathroom Vent/Fan
  description: ''
  triggers:
  - above: 97
    entity_id:
    - sensor.bathroom_humid
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: 'on'
    trigger: numeric_state
  - entity_id: sensor.bathroom_humid
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: 'off'
    below: 89
    trigger: numeric_state
    enabled: false
  - trigger: state
    entity_id:
    - binary_sensor.esp_bathroom_status
    to:
    - 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: 'on'
  conditions:
  - condition: template
    value_template: '{{true if now() - states.switch.bathroom_fan.last_changed < timedelta(minutes=2)
      else false }}'
    enabled: false
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'off'
      - condition: state
        entity_id: switch.bathroom_fan
        state: 'on'
      sequence:
      - data: {}
        target:
          entity_id: switch.bathroom_fan
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - data: {}
        target:
          entity_id: switch.bathroom_fan
        action: switch.turn_on
  mode: single
