- id: '1795117241464'
  alias: Chicken - Dim coop bulb when it comes on
  description: Moved from Node-RED 'Chicken' tab. When the coop bulb turns on (or
    its brightness is changed), or the Chicken Light Switch relay powers it (5s boot
    delay), set brightness to 1. Only runs while input_boolean.chicken_light_dimming
    is on.
  triggers:
  - entity_id: light.wink_ge_link_bulb
    id: bulb_on
    to: 'on'
    trigger: state
  - attribute: brightness
    entity_id: light.wink_ge_link_bulb
    id: bulb_brightness
    trigger: state
  - entity_id: switch.sonoff_4ch_relay_2
    id: relay_on
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.chicken_light_dimming
    state: 'on'
  actions:
  - if:
    - condition: trigger
      id: relay_on
    then:
    - delay:
        seconds: 5
  - if:
    - condition: state
      entity_id: light.wink_ge_link_bulb
      state: 'on'
    then:
    - action: light.turn_on
      data:
        brightness: 1
      target:
        entity_id: light.wink_ge_link_bulb
  max_exceeded: silent
  mode: single
- id: '1795117242202'
  alias: Chicken - Bug zapper on at sunset, off at sunrise
  description: Moved from Node-RED 'Chicken' tab. Switches the Bug Zapper/Water Heater
    outlet (sonoff_4ch_relay_3) on at sunset and off at sunrise. Only runs while input_boolean.chicken_bug_automations
    is on (zapper season).
  triggers:
  - event: sunset
    id: sunset
    trigger: sun
  - event: sunrise
    id: sunrise
    trigger: sun
  conditions:
  - condition: state
    entity_id: input_boolean.chicken_bug_automations
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_4ch_relay_3
    - conditions:
      - condition: trigger
        id: sunrise
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_4ch_relay_3
  mode: single
- id: '1795117532906'
  alias: Chores - Clear chore alert when bin is at the road
  description: Moved from Node-RED 'Frigate Bins' tab. When Frigate's oldroad camera
    sees a waste bin and the chore alert is active, turn the chore alert off. Also
    clears it if the alert turns on while a bin is already visible.
  triggers:
  - above: 0
    entity_id: sensor.oldroad_waste_bin_count
    trigger: numeric_state
  - trigger: state
    entity_id: alert.chores
    to: 'on'
  conditions:
  - condition: state
    entity_id: alert.chores
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.oldroad_waste_bin_count
    above: 0
  actions:
  - action: alert.turn_off
    target:
      entity_id: alert.chores
  mode: single
