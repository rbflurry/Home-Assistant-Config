      - condition: template
        value_template: '{{trigger.event.data.params.level <= 5}}'
      sequence:
      - data: {}
        target:
          entity_id:
          - light.sengled_e11_g13_035cb3f8_1
          - light.sengled_e11_g13_035c3bc7_1
        action: light.turn_off
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
