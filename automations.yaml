- id: '1795095322601'
  alias: Front porch bulb - dim at night, brighten on motion/person
  description: Bulb runs at 20% while the porch switch is on (sunset to sunrise).
    Doorbell motion/person or Frigate porch person brightens to 100%, then back to
    20% 3 minutes after everything clears.
  triggers:
  - entity_id: switch.wink_front_porch_switch
    id: porch_on
    to: 'on'
    trigger: state
  - id: activity
    target:
      entity_id:
      - binary_sensor.front_bell_motion
      - binary_sensor.front_bell_person
    trigger: motion.detected
  - id: activity
    target:
      entity_id: binary_sensor.frontporch_person_occupancy
    trigger: occupancy.detected
  conditions:
  - condition: state
    entity_id: switch.wink_front_porch_switch
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: porch_on
      sequence:
      - delay:
          seconds: 5
      - action: light.turn_on
        data:
          brightness_pct: 20
          transition: 2
        target:
          entity_id: light.front_porch
    - conditions:
      - condition: trigger
        id: activity
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 100
          transition: 1
        target:
          entity_id: light.front_porch
      - continue_on_timeout: true
        timeout:
          minutes: 30
        wait_template: '{{ is_state(''binary_sensor.front_bell_motion'', ''off'')
          and is_state(''binary_sensor.front_bell_person'', ''off'') and is_state(''binary_sensor.frontporch_person_occupancy'',
          ''off'') }}'
      - delay:
          minutes: 3
      - action: light.turn_on
        data:
          brightness_pct: 20
          transition: 3
        target:
          entity_id: light.front_porch
  mode: restart
- id: '1795096803599'
  alias: Smoke Detected
  description: Migrated from YAML (id 7f02c5a4-...). Calls and notifies, turns on
    indoor lights (label), shuts off HVAC so it doesn't circulate smoke. Each step
    continues on error so one failure can't block the rest.
  triggers:
  - entity_id: sensor.smoke_status
    to:
    - smoke
    - Smoke
    - co
    - CO
    - test
    trigger: state
  - entity_id: sensor.smoke_status
    from: OK
    to: unknown
    trigger: state
  conditions: []
  actions:
  - action: notify.twilio_call
    continue_on_error: true
    data:
      message: '{% set s = trigger.to_state.state | lower %}{% set what = {''smoke'':
        ''Smoke'', ''co'': ''Carbon monoxide'', ''test'': ''Smoke detector test'',
        ''unknown'': ''Smoke detector offline''}.get(s, trigger.to_state.state) %}{{
        what }} at Home. Repeat, {{ what }} at Home. Repeat, {{ what }} at Home.'
      target:
      - '+12406728691'
      - '+14105996687'
  - action: telegram_bot.send_message
    continue_on_error: true
    data:
      message: '{% set s = trigger.to_state.state | lower %}{% set what = {''smoke'':
        ''Smoke'', ''co'': ''Carbon monoxide'', ''test'': ''Smoke detector test'',
        ''unknown'': ''Smoke detector offline''}.get(s, trigger.to_state.state) %}{{
        what }} at Home (sensor reported: {{ trigger.to_state.state }})'
      title: '{% set s = trigger.to_state.state | lower %}{% set what = {''smoke'':
        ''Smoke'', ''co'': ''Carbon monoxide'', ''test'': ''Smoke detector test'',
        ''unknown'': ''Smoke detector offline''}.get(s, trigger.to_state.state) %}{{
        what }} at Home'
      entity_id:
      - notify.telegram_bot_700554930_618533989
      - notify.telegram_bot_700554930_664122562
  - action: homeassistant.turn_on
    continue_on_error: true
    target:
      label_id: indoor_lights
  - action: climate.set_fan_mode
    continue_on_error: true
    data:
      fan_mode: auto
    target:
      entity_id: climate.home
  - action: climate.set_hvac_mode
    continue_on_error: true
    data:
      hvac_mode: 'off'
    target:
      entity_id: climate.home
  mode: single
