- id: '1643722988108'
  alias: Climate - Turn off upstairs heat after 2 hours
  description: ''
  trigger:
  - platform: template
    value_template: '{{ is_state(''climate.office'', ''heat'') or is_state(''climate.office'',
      ''unavailable'') }}'
    for:
      hours: 2
  - platform: template
    value_template: '{{ is_state(''climate.craft_room'', ''heat'') or is_state(''climate.craft_room'',
      ''unavailable'') }}'
    for:
      hours: 2
