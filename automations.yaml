  alias: Chicken - New Water
  description: ''
  triggers:
  - event: sunrise
    offset: 0
    trigger: sun
  - at: '10:00:00'
    id: '10'
    trigger: time
  - entity_id:
    - switch.ahr_085_2_relay3
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.bathroom_fan
    state: unavailable
    enabled: false
  - condition: state
    entity_id: input_boolean.chicken_frozen
    state: 'off'
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.chicken_water_automations
      state: 'off'
    - condition: state
      entity_id: switch.ahr_085_2_relay3
      state: 'on'
    then:
    - data:
        message: Chicken Water Automation Disabled - Please remember to turn off water
        entity_id:
        - notify.telegram_bot_700554930_356616190_2
      action: telegram_bot.send_message
    - stop: Disabled
  - if:
    - condition: state
      entity_id: switch.ahr_085_2_relay3
      state: unavailable
    then:
    - data:
        message: Chicken Water Automation - Spigot is unavailable
        entity_id:
        - notify.telegram_bot_700554930_356616190_2
      action: telegram_bot.send_message
    - data: {}
      target:
        entity_id: input_boolean.chickens_need_watering
      action: homeassistant.turn_on
    - stop: Spigot Unavailable
  - if:
    - condition: state
      entity_id: input_boolean.chicken_water_automations
      state: 'off'
    then:
    - data: {}
      target:
        entity_id: input_boolean.chickens_need_watering
      action: homeassistant.turn_on
    - stop: Disabled
  - if:
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.pws_5in1_temperature
        below: 32.1
    then:
    - if:
      - condition: trigger
        id: '10'
      then:
      - data: {}
        target:
          entity_id: input_boolean.chickens_need_watering
        action: homeassistant.turn_on
      enabled: false
    - action: telegram_bot.send_message
      metadata: {}
      data:
        message: It was too cold to water the chickens, do it yourself.
        entity_id:
        - notify.telegram_bot_700554930_618533989
        - notify.telegram_bot_700554930_664122562
    - stop: Too Cold.
  - data:
      message: Filling the Watering Hole
      entity_id:
      - notify.telegram_bot_700554930_356616190_2
    action: telegram_bot.send_message
  - data: {}
    target:
      entity_id:
      - switch.ahr_085_2_relay3
    action: switch.turn_on
  - delay:
      hours: 0
      minutes: 0
      seconds: 50
      milliseconds: 0
  - data: {}
    target:
      entity_id:
      - switch.ahr_085_2_relay3
    action: switch.turn_off
  - data:
      skip_condition: true
    target:
      entity_id: automation.tag_chicken_water_is_scanned
    action: automation.trigger
  - data:
      message: The Watering Hole Is Full
      entity_id:
      - notify.telegram_bot_700554930_356616190_2
    action: telegram_bot.send_message
  max_exceeded: silent
  mode: single
