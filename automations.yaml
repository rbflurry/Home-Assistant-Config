- id: '1657809251650'
  alias: UPS Turn Off lights after blip
  description: ''
  triggers:
  - entity_id:
    - sensor.ups_trap
    to: 'UPS: No longer on battery power.'
    trigger: state
  - entity_id:
    - sensor.ups_status_data
    from: OB
    to: OL
    for:
      hours: 0
      minutes: 0
      seconds: 55
    trigger: state
  conditions: []
  actions:
  - continue_on_error: true
    data: {}
    target:
      entity_id:
      - light.sengled_e11_g13_035cb3f8_1
      - light.sengled_e11_g13_035c3bc7_1
      - light.wink_bed_room
      - light.wink_led_strip_bath
      - light.wled_bed
    action: homeassistant.turn_off
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - continue_on_error: true
    data: {}
    target:
      entity_id:
      - light.sengled_e11_g13_035cb3f8_1
      - light.sengled_e11_g13_035c3bc7_1
      - light.wink_bed_room
      - light.wink_led_strip_bath
      - light.wled_bed
    action: homeassistant.turn_off
  - delay:
      hours: 0
      minutes: 0
      seconds: 59
      milliseconds: 0
  - data: {}
    target:
      entity_id:
      - media_player.lg_webos_tv_nano80upa
      - media_player.lg_webos_tv_5a6f
    action: media_player.turn_off
  - data: {}
    target:
      entity_id: switch.sonoff_4ch_relay_4
    action: switch.turn_on
