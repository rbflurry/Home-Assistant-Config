- id: '1795114113320'
  alias: Chicken - Sunset close door V2
  description: Migrated from YAML (id 0ee5b3a6-...). Telegram via telegram_bot to
    Chat with the house.
  triggers:
  - trigger: template
    value_template: '{{ states.sensor.time.state == states.sensor.chicken_door_close_time_dirty.state
      }}'
  conditions:
  - condition: state
    entity_id: cover.chicken_door
    state: open
  - condition: template
    value_template: '{{ states.sensor.time.state >= states.sensor.chicken_door_close_time_dirty.state
      }}'
  - condition: state
    entity_id: input_boolean.chicken_door_last_call
    state: 'off'
  actions:
  - action: homeassistant.turn_on
    target:
      entity_id: input_boolean.chicken_door_automations
  - action: homeassistant.turn_off
    target:
      entity_id: switch.chicken_sensor_v2_chicken_door_lockout
  - action: cover.close_cover
    target:
      entity_id: cover.chicken_door
  - timeout: 00:00:20
    wait_template: '{{ is_state(''cover.chicken_door'', ''closed'') }}'
  - action: telegram_bot.send_message
    data:
      entity_id:
      - notify.telegram_bot_700554930_356616190_2
      inline_keyboard:
      - Open Door:/CHICKEN_OPEN_DOOR
      - Close Door:/CHICKEN_CLOSE_DOOR
      message: "{% if is_state('cover.chicken_door', 'closed') %}\n  Automation triggered
        the door to close and it did.\n{% else %}\n  Automation triggered the door
        to close but it did not!\n{% endif %}\n"
      title: "\U0001F414 Chicken Door Closed \U0001F414"
  - delay: 00:00:20
  - action: homeassistant.turn_off
    target:
      entity_id: input_boolean.chicken_door_automations
  mode: single
