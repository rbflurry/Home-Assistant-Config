- id: '1666117827132'
  alias: upstairs dimmer
  description: ''
  triggers:
  - event_data:
      command: move_to_level_with_on_off
      device_ieee: ff:ff:00:0f:e7:fd:72:22
    event_type: zha_event
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.params.level <= 5 }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.sengled_e11_g13_035cb3f8_1
          - light.sengled_e11_g13_035c3bc7_1
      - delay:
          seconds: 5
    default:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.outlet_1
        - switch.desk_power_strip_1
        - switch.desk_power_strip_usb_power
    - action: light.turn_on
      data:
        brightness: '{{ trigger.event.data.params.level | int }}'
        transition: 1
      target:
        entity_id:
        - light.sengled_e11_g13_035c3bc7_1
        - light.sengled_e11_g13_035cb3f8_1
  mode: restart
